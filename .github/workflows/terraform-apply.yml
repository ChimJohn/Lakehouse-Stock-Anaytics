name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ingestion/**"
      - "databricks/**"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.TF_VAR_AWS_REGION || 'ap-southeast-1' }}

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_databricks_host:  ${{ secrets.DATABRICKS_HOST }}
          TF_VAR_databricks_token: ${{ secrets.DATABRICKS_TOKEN }}
          TF_VAR_s3_bucket_prefix: ${{ vars.S3_BUCKET_PREFIX }}
          TF_VAR_aws_region:       ${{ vars.TF_VAR_AWS_REGION }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_databricks_host:  ${{ secrets.DATABRICKS_HOST }}
          TF_VAR_databricks_token: ${{ secrets.DATABRICKS_TOKEN }}
          TF_VAR_s3_bucket_prefix: ${{ vars.S3_BUCKET_PREFIX }}
          TF_VAR_aws_region:       ${{ vars.TF_VAR_AWS_REGION }}
