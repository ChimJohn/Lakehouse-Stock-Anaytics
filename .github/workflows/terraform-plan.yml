name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "ingestion/**"
      - "databricks/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.TF_VAR_AWS_REGION || 'ap-southeast-1' }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_databricks_host:    ${{ secrets.DATABRICKS_HOST }}
          TF_VAR_databricks_token:   ${{ secrets.DATABRICKS_TOKEN }}
          TF_VAR_s3_bucket_prefix:   ${{ vars.S3_BUCKET_PREFIX }}
          TF_VAR_aws_region:         ${{ vars.TF_VAR_AWS_REGION }}
          TF_VAR_aws_access_key:     ${{ secrets.TF_VAR_aws_access_key }}
          TF_VAR_aws_secret_key:     ${{ secrets.TF_VAR_aws_secret_key }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_chat_id:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TF_VAR_fmp_api_key:        ${{ secrets.FMP_API_KEY }}

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_databricks_host:    ${{ secrets.DATABRICKS_HOST }}
          TF_VAR_databricks_token:   ${{ secrets.DATABRICKS_TOKEN }}
          TF_VAR_s3_bucket_prefix:   ${{ vars.S3_BUCKET_PREFIX }}
          TF_VAR_aws_region:         ${{ vars.TF_VAR_AWS_REGION }}
          TF_VAR_aws_access_key:     ${{ secrets.TF_VAR_aws_access_key }}
          TF_VAR_aws_secret_key:     ${{ secrets.TF_VAR_aws_secret_key }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_chat_id:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TF_VAR_fmp_api_key:        ${{ secrets.FMP_API_KEY }}
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋

            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1